name: CSP proposal regression

on:
  pull_request:
    paths:
      - '**.php'
      - '**.html'
      - '**.htm'
      - '.htaccess'
      - 'docs/CSP-REPORT-ONLY.md'
      - '.github/workflows/csp-regression.yml'
  push:
    branches: [main]
    paths:
      - '**.php'
      - '**.html'
      - '**.htm'
      - '.htaccess'
      - 'docs/CSP-REPORT-ONLY.md'
      - '.github/workflows/csp-regression.yml'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check candidate, rendered sources and non-enforcement
        run: php tools/test-csp.php
